<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Yoda – Demo Home Assistant (Klickdummy)</title>
<style>
:root{--pg:#eef0f3;--pc:#fff;--pl:#dde1e7;--pt:#1d2430;--pt2:#5d6675;--pt3:#8a93a3;--blue:#2f80ed;--amber:#f2994a;--green:#27ae60;--red:#eb5757;--violet:#9b51e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--pg);color:var(--pt);font:14px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
/* Kopf */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--pc);border-bottom:1px solid var(--pl);flex-wrap:wrap}
.brand{font-weight:700}.brand small{display:block;font-weight:400;color:var(--pt2);font-size:12px}
.sp{flex:1}
.seg2{display:flex;background:var(--pg);border-radius:10px;padding:3px;gap:2px}
.seg2 button{padding:6px 10px;border-radius:8px;font-size:12px;color:var(--pt2);display:flex;align-items:center;gap:6px}
.seg2 button.on{background:var(--pc);color:var(--pt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg2 svg.i{width:16px;height:16px}
.pill{font-size:12px;color:var(--pt2);display:flex;align-items:center;gap:6px}
.pill b{color:var(--pt)}
select{background:var(--pg);border:1px solid var(--pl);border-radius:8px;padding:6px 8px;font:inherit;color:var(--pt)}
/* Raster */
.wrap{display:grid;grid-template-columns:var(--lw,460px) 1fr;height:calc(100% - 59px)}
.wrap.disp{--lw:56%}
@media (max-width:1000px){.wrap,.wrap.disp{grid-template-columns:1fr;height:auto}}
.left{background:#d9dde3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;overflow:hidden;min-height:0}
.devlabel{font-size:12px;color:var(--pt2);margin-bottom:10px;text-align:center}
.devlabel b{color:var(--pt)}
.fit{transform-origin:top center}
/* Geräte-Rahmen */
.frame{position:relative;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.frame.phone{width:392px;height:820px;border-radius:44px;border:11px solid #15171b}
.frame.display{width:1180px;height:690px;border-radius:14px;border:16px solid #15171b}
.frame.wall{width:420px;height:420px;border-radius:22px;border:26px solid #f2f2f0;box-shadow:0 12px 40px rgba(0,0,0,.25),inset 0 0 0 1px #ccc}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx)}
/* HA-Themes */
.t-light{--bg:#fafafa;--hd:#fff;--hdt:#212121;--bb:#ececec;--ic:#fff;--icon:#444;--on:#ffcf8a;--onic:#fff;--onicon:#e8890c;--tx:#212121;--tx2:#727272;--sl:#ffcf8a;--card:#fff;--line:#e0e0e0}
.t-ca{--bg:#1c2430;--hd:#fff;--hdt:#212121;--bb:#2a3442;--ic:#1f2733;--icon:#e9edf2;--on:#8a6634;--onic:#f0a64a;--onicon:#1c2430;--tx:#f1f4f8;--tx2:#9aa6b6;--sl:#8a6634;--card:#252e3b;--line:#354052}
.hd{background:var(--hd);color:var(--hdt);display:flex;align-items:center;height:56px;padding:0 6px;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.hd .tab{height:56px;width:48px;display:grid;place-items:center;color:#5f6368;position:relative}
.hd .tab.on{color:#212121}.hd .tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#212121}
.hd .sp{flex:1}
.wall .hd{height:44px}.wall .hd .tab{height:44px;width:44px}
.view{flex:1;overflow:auto;padding:16px 14px 90px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.display .view{padding:22px 28px 30px}
.wall .view{padding:10px 12px 14px}
.logo{font-weight:800;letter-spacing:.5px;color:var(--tx2);font-size:13px;margin:0 2px 10px;display:flex;align-items:center;gap:6px}
.logo i{font-style:normal;color:#e25b3a}
.secs{display:grid;gap:18px 22px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));align-items:start}
.sec{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
/* Überschrift */
.hdg{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 2px 0;font-size:16px;font-weight:500;flex-wrap:nowrap;overflow:hidden}
.hdg .i{width:18px;height:18px}
.hdg .bd{display:flex;gap:10px;margin-left:auto;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.hdg .bd span{display:flex;align-items:center;gap:3px}.hdg .bd svg.i{width:14px;height:14px}
.hdg.sub{font-size:14px;color:var(--tx2);min-height:28px}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--bb);color:var(--tx2);font-weight:500}
/* Bubble Card */
.bb{position:relative;height:56px;border-radius:32px;background:var(--bb);display:flex;align-items:center;gap:8px;padding:0 8px 0 7px;overflow:hidden;user-select:none;cursor:pointer;transition:background .25s}
.normal .bb{height:50px}
.bb .ic{width:42px;height:42px;border-radius:50%;background:var(--ic);display:grid;place-items:center;color:var(--icon);flex:none;position:relative;z-index:1;transition:background .25s,color .25s}
.normal .bb .ic{width:38px;height:38px}
.bb.on{background:var(--on)}.bb.on .ic{background:var(--onic);color:var(--onicon)}
.bb .tx{min-width:64px;flex:1;position:relative;z-index:1}
.bb .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb .st{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb.on .st{color:inherit;opacity:.8}
.bb .sub{font-size:12px;font-weight:500;white-space:nowrap;position:relative;z-index:1;display:flex;align-items:center;gap:4px;padding-right:6px}
.bb .fill{position:absolute;left:0;top:0;bottom:0;background:var(--sl);border-radius:32px 0 0 32px;transition:width .1s}
.bb .rnd{width:38px;height:38px;border-radius:50%;background:var(--ic);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.bb .rnd.act{background:var(--onic);color:var(--onicon)}
.bb .pm{display:flex;align-items:center;gap:6px;height:38px;border-radius:20px;background:var(--ic);padding:0 8px;font-size:13px;position:relative;z-index:1}
.bb .pm span{white-space:nowrap}.bb .pm button{width:24px;height:24px;display:grid;place-items:center}
.bb .chip{height:30px;border-radius:16px;padding:0 10px;background:var(--ic);font-size:12px;display:flex;align-items:center;position:relative;z-index:1;white-space:nowrap}
.opts{display:flex;gap:6px;flex-wrap:wrap;padding:6px 6px 2px}
.opts button{height:32px;padding:0 12px;border-radius:16px;background:var(--bb);font-size:12px}
.opts button.on{background:var(--on)}
/* Tile / Karten */
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:12px}
.card .ct{font-size:13px;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.media .mt{font-weight:700;font-size:15px}.media .ms{font-size:12px;color:var(--tx2)}
.media .ctl{display:flex;justify-content:center;gap:18px;margin:10px 0 6px}
.media .ctl button{width:40px;height:40px;border-radius:50%;background:var(--bb);display:grid;place-items:center}
.media .ctl button.big{background:var(--onic);color:var(--onicon)}
input[type=range]{width:100%;accent-color:var(--onic)}
.chart svg{width:100%;height:110px;display:block}
.mapc{height:160px;border-radius:14px;background:linear-gradient(135deg,#cfe3c8,#b9d6e8);position:relative;overflow:hidden}
.md{font-size:13px;line-height:1.5}.md b{font-weight:700}.md ul{margin:4px 0 0;padding-left:18px}
/* Navigationsleiste unten */
.nav{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;height:48px;border-radius:24px;background:var(--bb);display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:14px}
.nav button.on{background:var(--hd);outline:2px solid #212121}
/* rechte Seite */
.right{overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vhead .ttl{font-size:18px;font-weight:700}
.vhead .auto{font-size:11px;color:var(--blue)}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chips button{background:var(--pc);border:1px solid var(--pl);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--pt2)}
.chips button.on{color:var(--pt);border-color:var(--blue)}
.stage{flex:none;border-radius:16px;overflow:hidden;background:#0b0e14;position:relative;border:1px solid var(--pl)}
.stage svg{display:block;width:100%;height:auto;max-height:60vh}
.ph{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px}
.doit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.doit .lbl{font-size:12px;color:var(--pt2);margin-right:4px}
.doit button{background:var(--pc);border:1px solid var(--pl);border-radius:10px;padding:7px 12px;font-size:13px}
.doit button.on{background:#fff3e3;border-color:var(--amber)}
.explain{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:1300px){.explain{grid-template-columns:1fr}}
.box{background:var(--pc);border:1px solid var(--pl);border-radius:14px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:12px;color:var(--pt2);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.box p{margin:0;font-size:14px}
.box .tech{margin-top:8px;font-size:12px;color:var(--pt3)}
.log{margin:0;padding:0;list-style:none;font-size:12px;color:var(--pt2);max-height:120px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px dashed var(--pl)}
.log time{color:var(--pt3);margin-right:6px;font-variant-numeric:tabular-nums}
.bus{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:1400px){.bus{grid-template-columns:repeat(3,1fr)}}
.meter{background:var(--pc);border:1px solid var(--pl);border-radius:14px;padding:10px 12px}
.meter .k{font-size:11px;color:var(--pt2)}
.meter .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.meter .s{font-size:11px;color:var(--pt3)}
.bar{height:6px;border-radius:4px;background:var(--pg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .4s,background .4s}
/* SVG-Animationen */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%{transform:translateY(0);opacity:0}30%{opacity:.85}100%{transform:translateY(-60px);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes pulse{0%{r:14;opacity:.9}100%{r:46;opacity:0}}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(200px);opacity:0}}
@keyframes blink{50%{opacity:.15}}
.air path{opacity:0}.air.run path{animation:wave 2.2s ease-out infinite}
.flow{fill:none;stroke-linecap:round;stroke-dasharray:6 14;transition:stroke-width .4s,opacity .4s}
.flow.run{animation:dash 1s linear infinite}
.spin{transform-box:fill-box;transform-origin:center}.spin.run{animation:spin .8s linear infinite}
.pulse{animation:pulse 1.6s ease-out infinite}
.drops line{opacity:0}.drops.run line{animation:drop 1.1s linear infinite}
.blink{animation:blink 1s steps(2) infinite}
</style>
</head>
<body>
<header class="top">
  <div class="brand">CA Camping · Mein Master <small>Demo-Umgebung von <b>Familie Muster</b> · Auslieferung voraussichtlich Q2/2027</small></div>
  <div class="seg2" id="dev">
    <button data-d="phone" class="on">%%cellphone%% Smartphone</button>
    <button data-d="display">%%monitor%% 15″-Display</button>
    <button data-d="wall">%%tablet%% Wall Display</button>
  </div>
  <div class="seg2" id="farbe" title="Möbelfarbe">
    <button data-f="grau" class="on"><span style="width:12px;height:12px;border-radius:3px;background:#9b9ea3;display:inline-block"></span> Grau</button>
    <button data-f="sand"><span style="width:12px;height:12px;border-radius:3px;background:#c9b99b;display:inline-block"></span> Sand</button>
  </div>
  <div class="sp"></div>
  <span class="pill">Wo steht der Camper?
    <input id="ort" type="text" placeholder="Ort oder PLZ" value="Musterstadt am See" style="width:150px;background:var(--pg);border:1px solid var(--pl);border-radius:8px;padding:6px 8px;font:inherit;color:var(--pt)">
    <select id="scen" title="Strom vor Ort">
      <option value="cp16">Campingplatz (16 A)</option>
      <option value="cp10">Campingplatz (10 A)</option>
      <option value="v2l" selected>Frei stehend – Strom aus dem Fahrzeug</option>
      <option value="low">Frei stehend – Hausbatterien fast leer</option>
      <option value="home">Zu Hause an der Wallbox</option>
    </select></span>
  <span class="pill">Uhrzeit <b id="clock">20:00</b> · Zeitraffer 1 s = 1 min</span>
</header>

<div class="wrap" id="wrap">
  <section class="left" id="left">
    <div class="devlabel" id="devlabel"></div>
    <div class="fit" id="fit"><div class="frame phone" id="frame"><div class="screen t-light" id="screen"></div></div></div>
  </section>

  <section class="right">
    <div class="vhead">
      <span class="ttl" id="vttl">Wohnraum</span><span class="auto" id="vauto"></span>
      <div class="chips" id="chips"></div>
    </div>
    <div class="stage"><div id="scene"></div><span class="ph" id="ph">Illustration – wird durch Fotos von Master Yoda ersetzt</span></div>
    <div class="doit" id="doit"></div>
    <div class="explain">
      <div class="box"><h4>Was gerade passiert</h4><p id="what"></p><div class="tech" id="tech"></div></div>
      <div class="box"><h4>Verlauf</h4><ul class="log" id="log"></ul></div>
    </div>
    <div class="bus" id="bus"></div>
  </section>
</div>

  if (S.scen === 'cp10') return {src:'Campingplatz', lim:C.cp10, shore:true, plugged:false};
  if (S.scen === 'cp16' || S.scen === 'home') return {src: S.scen === 'home' ? 'Hausanschluss' : 'Campingplatz', lim:C.cp16, shore:true, plugged};
  if (S.car > S.min) return {src:'Fahrzeugbatterie (V2L)', lim:C.v2l, shore:false, plugged};
  return {src:'Fahrzeugbatterie gesperrt (Mindest-Ladestand)', lim:0, shore:false, plugged};
}
function compute(){
  const P = outside();
  const leds = Object.values(S.light).reduce((a, b) => a + b/100*C.ledW, 0) + kL()/100*C.ledW;
  const heizOn = S.heiz.mode === 'heat' && S.innen < S.heiz.ziel;
  const heizW = S.heiz.mode === 'heat' ? (heizOn ? (S.heiz.preset === 'high' ? C.heizHigh : C.heizEco) : 30) : 0;
  const irW = S.wt.mode === 'heat' && S.innen < S.wt.ziel ? C.ir : 0;
  const parts = {
    'Kühlschrank': C.kuehl, 'Steuerung & Router': C.basis, 'Licht': leds, 'Heizung': heizW, 'Infrarotpaneel': irW,
    'Dusche': S.duschen > 0 ? C.dusche : 0, 'Fernseher/Radio': S.media.on ? C.tv : 0,
    'Laptop (Steckdose Heck)': S.sw.doseHeck ? C.laptop : 0
  };
  const comfort = Object.values(parts).reduce((a, b) => a + b, 0);
  const ecoAvg = (S.eco1 + S.eco2) / 2;
  const ecoOk = ecoAvg > C.reserve && comfort <= 2 * C.ecoOut;
  const kochW = S.kochen > 0 ? C.induktion : 0;
  let prim = kochW + (ecoOk ? 0 : comfort);
  let head = P.lim - prim;
  const bTarget = S.boiler === 'Eco' ? 45 : (S.boiler === 'High' || S.boiler === 'Boost') ? 60 : 0;
  const boilerNeed = S.wasser < bTarget - 1;
  const boilerRun = boilerNeed && P.lim > 0 && (S.boiler === 'Boost' || head >= C.boiler + 200);
  if (boilerRun) { prim += C.boiler; head -= C.boiler; }
  const charge = {gen1:0, gen2:0};
  ['gen1','gen2'].forEach((g, i) => {
    const soc = i ? S.eco2 : S.eco1; const k = 'chg' + i;
    if (!S.sw[g] || soc >= 99.5 || P.lim === 0) { S.ch[k] = false; return; }
    if (P.shore) S.ch[k] = true; else { if (soc < C.v2lStart) S.ch[k] = true; if (soc >= C.v2lStop) S.ch[k] = false; }
    if (S.ch[k] && head > 300) { charge[g] = Math.min(C.ecoCharge, head - 200); head -= charge[g]; prim += charge[g]; }
  });
  return {P, parts, comfort, ecoOk, prim, head: P.lim - prim, kochW, boilerRun, boilerNeed, bTarget, charge, heizW, irW, overload: prim > P.lim + 1};
}
function tick(dt){
  const r = compute(), h = dt/60;
  const draw = r.ecoOk ? r.comfort / 2 : 0;
  S.eco1 = Math.max(0, Math.min(100, S.eco1 + (r.charge.gen1*0.9 - draw) * h / C.eco * 100));
  S.eco2 = Math.max(0, Math.min(100, S.eco2 + (r.charge.gen2*0.9 - draw) * h / C.eco * 100));
  if (!r.P.shore && r.P.lim > 0) S.car = Math.max(0, S.car - r.prim * h / C.carCap * 100);
  if (S.carCharging) { S.car = Math.min(S.soll, S.car + 11000 * h / C.carCap * 100); if (S.car >= S.soll) { S.carCharging = false; log('Fahrzeug fertig geladen'); } }
  S.wasser += (r.boilerRun ? 1.43 : 0) * dt - 0.015 * dt * (S.wasser - 12) / 30 - (S.duschen > 0 ? 0.8 * dt : 0);
  S.wasser = Math.max(10, S.wasser);
  const heat = r.heizW / 900 * 0.12 + r.irW / 400 * 0.05 + (S.carClima > 0 ? 0.02 : 0) + (S.duschen > 0 ? 0.03 : 0) + (S.kochen > 0 ? 0.02 : 0);
  S.innen += heat * dt - 0.012 * dt * (S.innen - C.aussen) / 8;
  S.feuchte = Math.max(35, Math.min(80, S.feuchte + (S.duschen > 0 ? 0.6 : 0) + (S.kochen > 0 ? 0.3 : 0) - (r.heizW > 100 ? 0.15 : 0.02)));
  if (S.kochen > 0) S.kMotion = Math.max(S.kMotion, 3);
  const kWas = kL();
  ['kochen','duschen','carClima','horn','flash','kMotion'].forEach(k => { if (S[k] > 0) { S[k] = Math.max(0, S[k] - dt); if (S[k] === 0 && k === 'kochen') log('Kochen beendet'); if (S[k] === 0 && k === 'duschen') log('Duschen beendet'); } });
  if (kWas && !kL()) log('Küchenlicht aus – keine Bewegung mehr');
  // Ereignisse in Alltagssprache
  const ev = (k, v, on, off) => { if (S.ch[k] !== undefined && S.ch[k] !== v) log(v ? on : off); S.ch[k] = v; };
  ev('boil', r.boilerRun, 'Boiler heizt – es ist genug Strom übrig', r.boilerNeed && S.boiler !== 'Aus' ? 'Boiler wartet – der Strom wird gerade woanders gebraucht' : 'Boiler hat seine Temperatur erreicht');
  ev('eco', r.ecoOk, 'Bordstrom kommt wieder aus den Hausbatterien', 'Hausbatterien unter Reserve – Bordstrom kommt jetzt direkt von außen');
  ev('ovl', r.overload, '⚠ Mehr Strom angefordert als von außen verfügbar', 'Stromaufnahme wieder im grünen Bereich');
  ev('ld', r.charge.gen1 + r.charge.gen2 > 0, 'Hausbatterien werden geladen', 'Hausbatterien laden pausiert');
  S.hist.push({p: r.prim, c: r.comfort, t: S.innen, f: S.feuchte}); if (S.hist.length > 120) S.hist.shift();
  S.t += dt;
  return r;
}
function log(msg){ S.log.unshift({t: clock(), msg}); S.log = S.log.slice(0, 14); renderLog(); }

const LADE = {charging:'Wird geladen', ended:'Ladevorgang beendet', v2l:'V2L verbunden', none:'Kein Ladevorgang'};
function ent(k, r){
  const sw = n => ({on: S.sw[n], st: S.sw[n] ? 'An' : 'Aus'});
  const pw = n => {
    if (n === 'gen1' || n === 'gen2') return fmtW(r.charge[n]);
    if (n === 'doseHeck') return S.sw.doseHeck ? fmtW(C.laptop) : '0 W';
    return '0 W';
  };
  const ladezustand = () => S.carCharging ? LADE.charging : (r.P.plugged && !r.P.shore) ? LADE.v2l : r.P.plugged ? LADE.ended : LADE.none;
  switch (k) {
    case 'gen1': case 'gen2': case 'res1': case 'res2': case 'doseHeck': case 'doseTrenn': case 'res3': case 'res4': return {...sw(k), sub: pw(k)};
    case 'carBatt': return {st: Math.round(S.car) + ' %', sub: Math.round(S.car * C.kmPerPct) + ' km', subIcon:'map-marker-distance'};
    case 'range': return {st: Math.round(S.car * C.kmPerPct) + ' km'};
    case 'energy': return {st: f1(S.car / 100 * C.carCap / 1000) + ' kWh'};
    case 'battTemp': return {st: '14 °C'};
    case 'lade': return {st: ladezustand(), sub: S.carCharging ? Math.round((S.soll - S.car) / 100 * C.carCap / 11000 * 60) + ' Min.' : '', subIcon:'timer-outline', on: S.carCharging};
    case 'stecker': return {st: r.P.plugged ? 'Eingesteckt' : 'Nicht eingesteckt'};
    case 'ladeleistung': return {st: S.carCharging ? '11 kW' : '0 kW'};
    case 'restzeit': return {st: S.carCharging ? Math.round((S.soll - S.car) / 100 * C.carCap / 11000 * 60) + ' Min.' : '–'};
    case 'klimaAktiv': return {st: S.carClima > 0 ? 'An' : 'Aus', on: S.carClima > 0};
    case 'innen': return {st: f1(S.innen) + ' °C'};
    case 'feuchte': return {st: Math.round(S.feuchte) + ' %'};
    case 'innenBB': return {st: f1(S.innen - 0.3) + ' °C'};
    case 'feuchteBB': return {st: Math.round(S.feuchte + 1) + ' %'};
    case 'taupunkt': return {st: f1(S.innen - (100 - S.feuchte) / 5) + ' °C'};
    case 'wasser': return {st: Math.round(S.wasser) + ' °C'};
    case 'wan': return {st: 'Online · öffentliche IP'};
    case 'tinOnline': return {st: 'Verbunden'};
    case 'tinErr': return {st: 'Kein Fehler'};
    case 'tinV': return {st: '13,3 V'};
    case 'tinFan': return {st: r.heizW > 0 ? 'Läuft' : 'Aus'};
    case 'helligkeit': return {st: Object.values(S.light).some(v => v) ? '120 lx' : '3 lx'};
  }
  return {st: '–'};
}

let curScene = null, vbNow = [0,0,1000,560], vbAnim = null;
function setFocus(scene, focus){ S.sceneView = scene; S.focus = focus || 'all'; }
function animateVB(target){
  const sv = document.getElementById('sv'); if (!sv) return;
  const from = vbNow.slice(), t0 = performance.now();
  cancelAnimationFrame(vbAnim);
  const step = now => { const k = Math.min(1, (now - t0) / 700), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    vbNow = from.map((v, i) => v + (target[i] - v) * e); sv.setAttribute('viewBox', vbNow.join(' ')); if (k < 1) vbAnim = requestAnimationFrame(step); };
  vbAnim = requestAnimationFrame(step);
}

    fahrzeug: [`Die Fahrzeugbatterie hat ${Math.round(S.car)} % (${Math.round(S.car*C.kmPerPct)} km). ${r.P.plugged && !r.P.shore ? `Sie versorgt gerade den Camper (V2L). Unter dem Mindest-Ladestand von ${S.min} % hört sie damit auf – damit du immer weiterfahren kannst.` : S.carCharging ? 'Sie wird gerade geladen.' : ''}`, `Ziel-Ladestand ${S.soll} % · Mindest-Ladestand ${S.min} %`],

    big: [`Das große Display zeigt jetzt „${S.big}“. Du kannst vom Wall Display oder Smartphone aus umschalten.`, '15″-Touch mit Google-TV-Stick'],

    remote: ['Die Fernbedienung steuert den Google-TV-Stick am großen Display – praktisch vom Bett aus.', 'Google TV']
  };
  const [w, t] = T[lastExplain] || T.start;

function renderLog(){ document.getElementById('log').innerHTML = S.log.map(e => `<li><time>${e.t}</time>${e.msg}</li>`).join('') || '<li>Noch nichts passiert.</li>'; }
function renderRight(r){
  document.getElementById('vttl').textContent = SCENE_NAMES[S.sceneView];

  const ecoAvg = (S.eco1 + S.eco2) / 2;
  const m = (k, v, s, p, col) => `<div class="meter"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div><div class="bar"><i style="width:${Math.max(0, Math.min(100, p))}%;background:${col}"></i></div></div>`;
  document.getElementById('bus').innerHTML =
    m('Strom von außen', fmtW(r.prim), r.P.src + ' · max. ' + fmtW(r.P.lim), r.P.lim ? r.prim / r.P.lim * 100 : 0, r.overload ? 'var(--red)' : r.prim / Math.max(1, r.P.lim) > .8 ? 'var(--amber)' : 'var(--green)') +
    m('Bordstrom', fmtW(r.comfort), r.ecoOk ? 'aus den Hausbatterien' : 'direkt von außen', r.comfort / 4800 * 100, 'var(--violet)') +
    m('Hausbatterie 1', Math.round(S.eco1) + ' %', r.charge.gen1 ? 'lädt ' + fmtW(r.charge.gen1) : 'Reserve ' + C.reserve + ' %', S.eco1, S.eco1 < C.reserve ? 'var(--red)' : 'var(--blue)') +
    m('Hausbatterie 2', Math.round(S.eco2) + ' %', r.charge.gen2 ? 'lädt ' + fmtW(r.charge.gen2) : 'Reserve ' + C.reserve + ' %', S.eco2, S.eco2 < C.reserve ? 'var(--red)' : 'var(--blue)') +
    m('Fahrzeugbatterie', Math.round(S.car) + ' %', Math.round(S.car * C.kmPerPct) + ' km Reichweite', S.car, S.car < S.min ? 'var(--red)' : 'var(--green)');
  document.getElementById('clock').textContent = clock();
}
function render(r){ r = r || compute(); renderDash(r); updateScene(r); explain(r); renderRight(r); fitFrame(); }

/* ================= Bedienung ================= */
function go(scene, focus, ex){ if (S.autoView) setFocus(scene, focus); else if (S.sceneView === scene) S.focus = focus || 'all'; lastExplain = ex; }
function act(a, e){
  S.autoView = true;
  const name = {gen1:'Generator 1', gen2:'Generator 2', res1:'Reserve 1', res2:'Reserve 2', res3:'Reserve 3', res4:'Reserve 4', doseHeck:'Steckdose Heck', doseTrenn:'Steckdose Trennwand'};
  const LN = {hl:'Heck links', hr:'Heck rechts', kueche:'Küche', bad:'Dusche'};
  switch (a) {
    case 'switch':
      if (e === 'apn') { go('innen', 'all', 'system'); break; }
      S.sw[e] = !S.sw[e]; log(`${name[e]} ${S.sw[e] ? 'an' : 'aus'}`);
      if (e.startsWith('gen')) go('energie', 'all', 'gen'); else if (e === 'doseHeck') go('innen', 'bett', 'doseHeck'); else if (e === 'doseTrenn') go('innen', 'trenn', 'doseTrenn'); else go('energie', 'all', 'res');
      break;
    case 'slider-toggle': S.light[e] = S.light[e] ? 0 : 80; log(`Licht ${LN[e]} ${S.light[e] ? 'an' : 'aus'}`); go(e === 'bad' ? 'bad' : 'innen', e === 'bad' ? 'all' : e, 'licht'); break;
    case 'number-toggle': break;
    case 'clpower': S[e].mode = S[e].mode === 'heat' ? 'off' : 'heat'; log(`${e === 'heiz' ? 'Heizung' : 'Wandthermostat'} ${S[e].mode === 'heat' ? 'an' : 'aus'}`); go('innen', e === 'heiz' ? 'heizung' : 'ir', e); break;
    case 'clmode': S[e].mode = S[e].mode === 'heat' ? 'off' : 'heat'; log(`${e === 'heiz' ? 'Heizung' : 'Wandthermostat'}: ${S[e].mode === 'heat' ? 'Heizen' : 'Aus'}`); go('innen', e === 'heiz' ? 'heizung' : 'ir', e); break;
    case 'clpreset': S.heiz.preset = S.heiz.preset === 'eco' ? 'high' : 'eco'; log('Heizstufe ' + (S.heiz.preset === 'high' ? 'High' : 'Eco')); go('innen', 'heizung', 'heiz'); break;
    case 'clminus': case 'clplus': S[e].ziel = Math.max(5, Math.min(30, S[e].ziel + (a === 'clplus' ? .5 : -.5))); go('innen', e === 'heiz' ? 'heizung' : 'ir', e); break;
    case 'selopen': S.openSel = S.openSel === e ? null : e; go('bad', 'all', 'boiler'); break;
    case 'selpick': S.boiler = e; S.openSel = null; log('Boiler: ' + e); go('bad', 'all', 'boiler'); break;
    case 'state':
      if (['carBatt','range','energy','battTemp','lade','stecker','ladeleistung','restzeit','klimaAktiv'].includes(e)) go('fahrzeug', 'all', 'fahrzeug');
      else if (['innen','feuchte','innenBB','feuchteBB','taupunkt'].includes(e)) go('innen', 'einstieg', 'wt');
      else if (e === 'wasser') go('bad', 'all', 'boiler'); else go('innen', 'all', 'system');
      break;
    case 'action':
      if (e === 'vorklima') { S.carClima = 15; log('Fahrerhaus wird vorklimatisiert'); go('fahrzeug', 'all', 'vorklima'); }
      if (e === 'hupe') { S.horn = 1; log('Hupe'); go('fahrzeug', 'all', 'hupe'); }
      if (e === 'lichthupe') { S.flash = 1; log('Lichthupe'); go('fahrzeug', 'all', 'hupe'); }
      if (e === 'ladenStart') { const P = outside(); if (S.scen === 'home') { S.carCharging = true; log('Laden gestartet'); } else log(P.plugged ? 'Laden nicht möglich – das Kabel ist für V2L gesteckt' : 'Laden nicht möglich – kein Kabel eingesteckt'); go('fahrzeug', 'all', 'fahrzeug'); }
      if (e === 'stop') { S.media.on = false; log('Wiedergabe gestoppt'); go('innen', 'display', 'media'); }
      if (e === 'spotify') { S.media = {...S.media, on:true, kind:'radio', title:'Spotify – Roadtrip-Mix'}; log('Spotify gestartet'); go('innen', 'display', 'media'); }
      if (['wallOn','wallOff','wallRestart'].includes(e)) { log('Wall Display: ' + {wallOn:'an', wallOff:'aus', wallRestart:'Neustart'}[e]); go('innen', 'einstieg', 'system'); }
      break;
    case 'radio': S.media = {...S.media, on:true, kind:'radio', title:RADIO[e]}; log('Radio: ' + RADIO[e]); go('innen', 'display', 'media'); break;
    case 'stream': S.media = {...S.media, on:true, kind:'stream', title:STREAM[e]}; S.big = 'Video'; log('Streaming: ' + STREAM[e]); go('innen', 'display', 'media'); break;
    case 'lscene': {
      if (e === 'an') S.light = {...S.light, hl:70, hr:70};
      if (e === 'nacht') S.light = {...S.light, hl:10, hr:10, bad:0};
      if (e === 'aus') S.light = {hl:0, hr:0, bad:0};
      log({an:'Licht an – Heck links und rechts 70 %', nacht:'Nachtlicht 10 %', aus:'Alles Licht aus'}[e]); go('innen', 'all', 'lscene'); break; }
    case 'big': S.big = e; log('Großes Display zeigt: ' + e); go('innen', 'display', 'big'); break;
    case 'kauto': S.kAuto = !S.kAuto; log('Küchenlicht-Automatik ' + (S.kAuto ? 'an' : 'aus')); go('innen', 'klicht', 'kuechenlicht'); break;
    case 'toggle': S[e] = !S[e]; log('Echo ' + (S[e] ? 'gekoppelt' : 'getrennt')); go('innen', 'display', 'media'); break;
    case 'remote': log('Fernbedienung: ' + e); go('innen', 'display', 'remote'); break;
    case 'mplay': S.media.on = !S.media.on; if (S.media.on && !S.media.title) { S.media.kind = 'radio'; S.media.title = RADIO[0]; } log(S.media.on ? 'Wiedergabe: ' + S.media.title : 'Pause'); go('innen', 'display', 'media'); break;
    case 'mnext': case 'mprev': { const list = S.media.kind === 'stream' ? STREAM : RADIO; let i = list.indexOf(S.media.title); i = (i + (a === 'mnext' ? 1 : list.length - 1)) % list.length; S.media = {...S.media, on:true, kind:S.media.kind || 'radio', title:list[i]}; log('Wiedergabe: ' + list[i]); go('innen', 'display', 'media'); break; }
  }
  render();
}
const screenEl = document.getElementById('screen');
screenEl.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.view[S.dev] = tab.dataset.tab; const v = tab.dataset.tab; S.openSel = null;
    const map = {strom:['energie','all','energie'], fahrzeug:['fahrzeug','all','fahrzeug'], klima:['innen','heizung','heiz'], waerme:['innen','heizung','heiz'], system:['innen','einstieg','system'], info:['innen','einstieg','system'], umgebung:['innen','all','umgebung'], audio:['innen','display','media'], video:['innen','display','media'], medien:['innen','display','media'], licht:['innen','einstieg','lscene'], fernbedienung:['innen','display','remote'], start:['innen','all','start'], display:['innen','all','start']}[v];
    if (map) { S.autoView = true; go(map[0], map[1], map[2]); } render(); screenEl.querySelector('.view').scrollTop = 0; return; }
  if (e.target.matches('input')) return;
  const el = e.target.closest('[data-a]'); if (!el || el.matches('input')) return;
  if (el.closest('[data-slide]') && !el.matches('.ic')) return;
  e.stopPropagation(); act(el.dataset.a, el.dataset.e);
});
screenEl.addEventListener('input', e => { if (e.target.dataset.a === 'mvol') S.media.vol = +e.target.value; });
let ortEdit = false;
function setOrt(v, src){ S.ort = v.trim(); if (src !== 'head') document.getElementById('ort').value = S.ort; log('Standort: ' + (S.ort || '–'));
  if (S.dev === 'phone') S.view.phone = 'umgebung'; else if (S.dev === 'display') S.view.display = 'umgebung';
  S.autoView = true; go('innen', 'all', 'umgebung'); render(); }
screenEl.addEventListener('focusin', e => { if (e.target.dataset.a === 'ort') ortEdit = true; });
screenEl.addEventListener('focusout', e => { if (e.target.dataset.a === 'ort') ortEdit = false; });
screenEl.addEventListener('change', e => { if (e.target.dataset.a === 'ort') { ortEdit = false; setOrt(e.target.value, 'dash'); } });
document.getElementById('ort').addEventListener('change', e => setOrt(e.target.value, 'head'));
// Bubble-Slider: über die ganze Karte ziehen
let drag = null;
screenEl.addEventListener('pointerdown', e => {
  const s = e.target.closest('[data-slide]'); if (!s || e.target.closest('.ic')) return;
  drag = {el: s, kind: s.dataset.slide, e: s.dataset.e}; s.setPointerCapture(e.pointerId); slideTo(e); e.preventDefault();
});
screenEl.addEventListener('pointermove', e => { if (drag) slideTo(e); });
screenEl.addEventListener('pointerup', () => { if (!drag) return; const d = drag; drag = null;
  if (d.kind === 'slider') { log(`Licht ${({hl:'Heck links',hr:'Heck rechts',kueche:'Küche',bad:'Dusche'})[d.e]} ${S.light[d.e] ? 'auf ' + S.light[d.e] + ' %' : 'aus'}`); }
  else log(`${d.e === 'soll' ? 'Ziel-Ladestand' : 'Mindest-Ladestand'} ${S[d.e]} %`);
  render(); });
function slideTo(e){
  const rc = drag.el.getBoundingClientRect(); let v = Math.round(Math.max(0, Math.min(1, (e.clientX - rc.left) / rc.width)) * 100);
  if (drag.kind === 'slider') { S.light[drag.e] = v < 3 ? 0 : v; S.autoView = true; if (drag.e === 'bad') setFocus('bad', 'all'); else setFocus('innen', drag.e); lastExplain = 'licht'; }
  else { v = drag.e === 'soll' ? Math.max(50, Math.round(v / 5) * 5) : Math.min(50, Math.max(10, Math.round(v / 5) * 5)); S[drag.e] = v; setFocus('fahrzeug', 'all'); lastExplain = 'fahrzeug'; }
  drag.el.querySelector('.fill').style.width = (drag.kind === 'slider' ? S.light[drag.e] : S[drag.e]) + '%';
  const st = drag.el.querySelector('.st'); if (st) st.textContent = drag.kind === 'slider' ? (S.light[drag.e] ? S.light[drag.e] + ' %' : 'Aus') : S[drag.e] + ' %';
  drag.el.classList.toggle('on', drag.kind !== 'slider' || S.light[drag.e] > 0);
  const r = compute(); updateScene(r); explain(r);
}
document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('[data-sc]'); if (!b) return; S.autoView = false; setFocus(b.dataset.sc, 'all'); lastExplain = {innen:'start', bad:'duschen', energie:'energie', fahrzeug:'fahrzeug'}[b.dataset.sc]; render(); });
document.getElementById('doit').addEventListener('click', e => { const b = e.target.closest('[data-do]'); if (!b) return; S.autoView = true;
  if (b.dataset.do === 'kochen') { S.kochen = S.kochen > 0 ? 0 : 12; log(S.kochen ? 'Kochen mit beiden Feldern (ca. 12 Min.)' : 'Kochen beendet'); go('innen', 'kueche', 'kochen'); }
  if (b.dataset.do === 'einsteigen') { S.dev = 'wall'; S.view.wall = 'licht'; S.kMotion = 5;
    document.querySelectorAll('#dev button').forEach(x => x.classList.toggle('on', x.dataset.d === 'wall'));
    document.getElementById('frame').className = 'frame wall'; document.getElementById('wrap').classList.remove('disp'); document.getElementById('devlabel').innerHTML = DEVINFO.wall;
    log('Du steigst ein – das Wall Display zeigt sofort das Licht'); go('innen', 'einstieg', 'einsteigen'); }
  if (b.dataset.do === 'kueche') { S.kMotion = 5; log(S.kAuto ? 'Bewegung in der Küche – Licht geht an' : 'Bewegung in der Küche – Automatik ist aus'); go('innen', 'klicht', 'kuechenlicht'); }
  if (b.dataset.do === 'duschen') { S.duschen = S.duschen > 0 ? 0 : 10; log(S.duschen ? 'Duschen (ca. 10 Min.)' : 'Duschen beendet'); go('bad', 'all', 'duschen'); }
  render(); });
document.getElementById('dev').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; S.dev = b.dataset.d; S.openSel = null;
  document.querySelectorAll('#dev button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('frame').className = 'frame ' + S.dev; document.getElementById('wrap').classList.toggle('disp', S.dev === 'display');
  document.getElementById('devlabel').innerHTML = DEVINFO[S.dev];
  S.autoView = true; go('innen', S.dev === 'phone' ? 'all' : S.dev === 'display' ? 'display' : 'einstieg', 'start'); render(); });
document.getElementById('farbe').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; S.moebel = b.dataset.f;
  document.querySelectorAll('#farbe button').forEach(x => x.classList.toggle('on', x === b)); log('Möbelfarbe: ' + (S.moebel === 'sand' ? 'Sand' : 'Grau'));
  curScene = null; if (S.sceneView !== 'innen' && S.sceneView !== 'bad') setFocus('innen', 'all'); render(); });
document.getElementById('scen').addEventListener('change', e => {
  const v = e.target.value; S.scen = v === 'low' ? 'v2l' : v;
  if (v === 'low') { S.eco1 = 23; S.eco2 = 21; }
  S.carCharging = false;
  log('Standort: ' + e.target.options[e.target.selectedIndex].text); S.autoView = true; go('energie', 'all', 'energie'); render(); });
function fitFrame(){
  const left = document.getElementById('left'), fit = document.getElementById('fit'), fr = document.getElementById('frame');
  const fw = fr.offsetWidth, fh = fr.offsetHeight, aw = left.clientWidth - 32, ah = left.clientHeight - 60;
  const s = Math.min(1, aw / fw, ah > 200 ? ah / fh : 1);
  fit.style.transform = `scale(${s})`; fit.style.height = (fh * s) + 'px'; fit.style.width = (fw * s) + 'px';
  fit.style.transformOrigin = 'top left';
}
window.addEventListener('resize', fitFrame);
setInterval(() => { const r = tick(1); if (drag || ortEdit) { updateScene(r); renderRight(r); return; } render(r); }, 1000);
document.getElementById('devlabel').innerHTML = DEVINFO.phone;
log('Willkommen in deinem Camper – es ist 20 Uhr, draußen 6 °C.');
render();
